# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: msa-em-template-lite-1
  title: Article template for Elemental Microscopy (Lite / In-Browser)
  description: A self-hosted, in-browser-compute version of the Elemental Microscopy article template, powered by MyST + JupyterLite.
  short_title: EM Template Lite
  keywords:
    - Article Template
    - Computational Article
    - JupyterLite
    - Self-hosted
  github: https://github.com/msa-em/em-template-lite
  # In-browser kernel via JupyterLite (built into ./lite/ alongside the site)
  jupyter:
    lite: true
  # Uncomment for local notebook authoring with a live Jupyter server:
  #  jupyter:
  #    server:
  #      url: 'http://localhost:8888'
  #      token: 'devtoken'
  open_access: true
  license: CC-BY-4.0
  banner: banner.png
  thumbnail: thumbnail.webp
  date: 2026-05-23
  history:
    submitted: 2026-05-23
  venue:
    title: Elemental Microscopy
    short_title: EM
  requirements:
    - 'environment.yml'
  resources:
    - 'notebooks/**/*'
    - 'widgets/**/*'
    - 'assets/**/*'
  references:
    mystmd: https://mystmd.org/guide
  exclude:
    - README.md
    - scripts/**
    - .github/**
