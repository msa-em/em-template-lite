  abbreviations:
    4D-STEM: four dimensional scanning transmission electron microscopy
    BibTeX: portmanteau of of "bibliography" and TeX (LaTeX)
    DOI: digital object identifier
    EWR: exit wave reconstruction
    FAIR: findable, accessible, interoperable, and reusable
    FFT: fast Fourier transform
    FOV: field-of-view
    GB: grain boundary
    HAADF: high angle annular dark field
    HRTEM: high resolution transmission electron microscopy
    M&M: Microscopy and Microanalysis
    PDF: portable document format
    STEM: scanning transmission electron microscopy
site:
  template: book-theme
  title: Elemental Microscopy
  short_title: EM
  options:
    # Custom CSS — see ./style.css for the actual rules.
    style: ./style.css
    # The text rendered next to the (omitted) logo in the upper-left.
    # Coloring is done in style.css.
    logo_text: Elemental Microscopy
    logo_url: /
    # Show only top-level entries by default in the right-hand outline.
    outline_maxdepth: 2
    # Hide the global search bar in the top nav.
    hide_search: true
    # Hide the prev/next page links book-theme inserts in the page footer.
    hide_footer_links: true
  nav:
    - title: Overview
      url: https://www.elementalmicroscopy.org/overview
    - title: Latest Research
      url: https://www.elementalmicroscopy.org/articles
    - title: Submit
      url: https://www.elementalmicroscopy.org/writing-an-article
    - title: Team
      url: https://www.elementalmicroscopy.org/editors
  # book-theme exposes named "parts" — content blocks that the template
  # slots into specific layout regions. We use:
  #   navbar_end:  the right side of the top nav (MSA logo)
  #   footer:      the bottom-of-page colophon (replaces "Made with MyST")
  parts:
    # Two MSA image-links: the light version for light mode, dark version for
    # dark mode. CSS in style.css toggles which is visible. The external-link
    # icon book-theme attaches to off-site links is also hidden via CSS.
    navbar_end: |
      [![MSA](/assets/msa-logo-light.svg)](https://www.microscopy.org/) [![MSA](/assets/msa-logo-dark.svg)](https://www.microscopy.org/)
    footer: |
      Published by the [Microscopy Society of America](https://www.microscopy.org/). *Elemental Microscopy* is an open-access journal of MSA.
    primary_sidebar_footer: |
      *Elemental Microscopy* · MSA
