name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but don't cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          # `av` (pyav) is needed only for the one-time mp4 -> npz decode in prep_data.py.
          # jupyterlite-* build the in-browser kernel bundle.
          # jupyter-server is required by jupyterlite's `contents` addon to
          # index custom notebooks into the bundle.
          python -m pip install \
            "numpy" "imageio" "av" \
            "jupyterlite-core" "jupyterlite-pyodide-kernel" \
            "jupyter-server"

      - name: Install MyST CLI
        run: npm install -g mystmd

      - name: Pre-decode mp4 -> npz (Pyodide lacks pyav)
        run: python scripts/prep_data.py

      - name: Quantize image data for anywidget viewer
        run: python scripts/prep_widget_data.py

      - name: Build JupyterLite
        run: |
          jupyter lite build \
            --contents notebooks \
            --output-dir _output/site/lite

      - name: Build MyST static site
        env:
          # GitHub Pages serves this repo at /em-template-lite/. MyST uses
          # BASE_URL to prefix asset paths so internal links resolve correctly.
          BASE_URL: /em-template-lite
        run: myst build --html

      - name: Combine MyST + JupyterLite + anywidget data
        run: |
          # MyST writes the static site to _build/html. Merge it into _output/site,
          # which already contains _output/site/lite/ from the JupyterLite step.
          mkdir -p _output/site
          cp -r _build/html/. _output/site/

          # MyST auto-hashes and copies the anywidget JS itself, but the data
          # files referenced by the widget's `model` body are opaque strings to
          # MyST. Stage them under the same `widgets/data/` path the model points at.
          mkdir -p _output/site/widgets/data
          cp -r widgets/data/. _output/site/widgets/data/

          echo "Site contents:"
          ls -la _output/site/
          echo "Widget data:"
          ls -la _output/site/widgets/data/
          echo "JupyterLite contents:"
          ls -la _output/site/lite/ | head -10

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _output/site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
